name: Despliegue automático

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t hotel-5-huellas .

      - name: Comprobar que el código PHP no tiene errores
        run: |
          docker run --rm hotel-5-huellas sh -c 'for f in $(find /usr/src/wordpress/wp-content/themes/hotel-5-huellas /usr/src/wordpress/wp-content/mu-plugins -name "*.php" 2>/dev/null); do php -l "$f" || exit 1; done'

      - name: Subir imagen a GitHub Container Registry
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag hotel-5-huellas $IMAGE
          docker push $IMAGE

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar con Docker Compose
        shell: cmd
        run: docker compose up -d --build -V