name: CI-CD Hotel 5 Huellas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hotel5huellas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Tests unitarios (TDD - PHPUnit)
        run: vendor/bin/phpunit
      - name: Tests de comportamiento (BDD - Behat)
        if: ${{ hashFiles('features/*.feature') != '' }}
        run: vendor/bin/behat --colors --no-interaction

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose config -q
        env:
          DB_PASSWORD: x
          DB_ROOT_PASSWORD: x
      - name: Construir imagen candidata
        run: docker build -t hotel5huellas-candidata .
      - name: Comprobar sintaxis PHP
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar
        shell: cmd
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: docker compose -p hotel5huellas up -d --build -V --no-deps --force-recreate wordpress
      - name: Comprobar que responde
        shell: cmd
        run: curl --retry 15 --retry-delay 4 --retry-connrefused -fsS http://localhost:8080/ -o NUL
